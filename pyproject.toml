[project]
name = "sheetmusicshelf"
version = "0.1.0"
description = "A cataloguing server for a personal sheet music library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "typer>=0.15",
    "rich>=13.9",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
sms = "sms.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sms"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
